# Publishes a release when a version tag is pushed:
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Builds the PS5 client, the Windows app and flexd, and the Android app with
# that version, and attaches them with SHA256SUMS. FLEX servers pick the PS5
# build up from here and offer it to consoles; the Windows and Android apps
# update themselves from it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.3.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ps5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Toolchain
        run: bash ps5-client/tools/setup-wsl.sh
      - name: Build
        working-directory: ps5-client
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: make release VERSION="${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ps5
          path: |
            ps5-client/build/FLEX-ps5.elf
            ps5-client/build/FLEX-ps5.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # plain go build with the flags `wails build` uses: the Wails CLI loads
      # packages with an old golang.org/x/tools that can't read Go 1.26's.
      # Wails turns on DPI awareness itself (SetProcessDPIAware at start).
      - name: FLEX.exe
        working-directory: desktop
        run: go build -tags desktop,production -ldflags "-s -w -H windowsgui -X flex/server.Version=${TAG#v}" -o FLEX.exe .
      - name: flexd.exe
        run: go build -ldflags "-X flex/server.Version=${TAG#v}" -o flexd.exe ./cmd/flexd
      - name: Collect
        run: mkdir dist && cp desktop/FLEX.exe flexd.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # the release key (a PKCS12 keystore, alias "flex") from the repository's
      # secrets; the same key every release, or Android refuses the update
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "secret ANDROID_KEYSTORE is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flex.p12"
      - name: Build
        working-directory: android
        env:
          FLEX_KEYSTORE: ${{ runner.temp }}/flex.p12
          FLEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PflexVersion="${TAG#v}"
      - name: Collect
        run: mkdir dist && cp android/app/build/outputs/apk/release/app-release.apk dist/FLEX-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  publish:
    needs: [ps5, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: .github/release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum FLEX.exe flexd.exe FLEX-ps5.elf FLEX-ps5.zip FLEX-android.apk > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # the setup notes come first, the generated list of changes after them
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "FLEX $TAG" \
              --notes-file .github/release-notes.md --generate-notes
          fi
