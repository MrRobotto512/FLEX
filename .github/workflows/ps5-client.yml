# Builds the PS5 client with the ps5-payload-sdk toolchain (the same setup
# script as for WSL) and keeps the ELF as a workflow artifact. Releases are
# built by release.yml.
name: ps5-client

on:
  push:
    paths: ['ps5-client/**', '.github/workflows/ps5-client.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe gives the version
      - name: Toolchain
        run: bash ps5-client/tools/setup-wsl.sh
      - name: Build
        working-directory: ps5-client
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: FLEX-ps5
          path: |
            ps5-client/build/FLEX-ps5.elf
            ps5-client/build/FLEX-ps5.zip
