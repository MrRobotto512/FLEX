# Builds the Android app (android/) and keeps the APK as a workflow artifact,
# signed with the debug key here. Releases are built and signed by release.yml.
name: android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: FLEX-android
          path: android/app/build/outputs/apk/release/app-release.apk
