name: server

on:
  push:
    paths: ['server/**', 'cmd/**', 'web/**', 'go.mod', 'go.sum', '.github/workflows/server.yml']
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve modules
        run: go mod tidy
      - run: go vet ./...
      - run: go build -o bin/ ./cmd/flexd
      - run: go test ./...
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: flexd-windows
          path: bin/
