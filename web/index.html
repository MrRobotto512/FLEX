<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>FLEX</h1>
  <nav id="tabs">
    <button data-mode="movies" class="active">Movies</button>
    <button data-mode="tv">TV</button>
  </nav>
  <span id="server" class="muted">connecting…</span>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="Search" autocomplete="off">
  <button id="scan" title="Rescan library">Scan</button>
</header>

<main id="grid" role="grid" aria-label="Library"></main>
<p id="empty" class="muted" hidden></p>

<section id="episodes" hidden>
  <div id="show-head">
    <img id="show-poster" alt="">
    <div>
      <h2 id="show-title"></h2>
      <p id="show-meta" class="muted"></p>
      <p id="show-overview"></p>
      <p class="muted hint">Enter plays · Backspace returns to the shows</p>
    </div>
  </div>
  <ul id="eplist"></ul>
</section>

<section id="player" hidden>
  <video id="video" playsinline></video>
  <div id="osd">
    <strong id="osd-title"></strong>
    <span id="osd-info" class="muted"></span>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
