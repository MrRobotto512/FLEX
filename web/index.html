<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>FLEX</h1>
  <nav id="tabs">
    <button data-mode="home" class="active">Home</button>
    <button data-mode="movies">Movies</button>
    <button data-mode="tv">TV</button>
  </nav>
  <span id="server" class="muted">connecting…</span>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="Search" autocomplete="off">
  <button id="scan" title="Rescan library">Scan</button>
</header>

<main id="home" aria-label="Home">
  <div id="hero">
    <span id="hero-tag" class="tag"></span>
    <h2 id="hero-title"></h2>
    <p id="hero-meta" class="muted"></p>
    <p id="hero-overview"></p>
  </div>
  <div id="shelves"></div>
</main>
<main id="grid" role="grid" aria-label="Library" hidden></main>
<p id="empty" class="muted" hidden></p>

<section id="episodes" hidden>
  <div id="show-head">
    <img id="show-poster" alt="">
    <div>
      <h2 id="show-title"></h2>
      <p id="show-meta" class="muted"></p>
      <p id="show-overview"></p>
      <p class="muted hint">Enter plays · Backspace returns to the shows</p>
    </div>
  </div>
  <ul id="eplist"></ul>
</section>

<section id="player" hidden>
  <video id="video" playsinline></video>
  <div id="osd">
    <strong id="osd-title"></strong>
    <span id="osd-info" class="muted"></span>
  </div>
</section>

<section id="cast" hidden>
  <div id="cast-box">
    <h2 id="cast-head">Cast to…</h2>
    <p id="cast-sub" class="muted"></p>
    <ul id="cast-list"></ul>
    <p id="cast-hint" class="muted hint"></p>
  </div>
</section>

<script src="hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
